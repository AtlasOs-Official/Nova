<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Fluid Blue Abstract Background */
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2064&auto=format&fit=crop'); 
            --bg-color: #0067c0;
            --win-rgb: 255, 255, 255;
            --taskbar-rgb: 243, 243, 243;
            --ui-alpha: 1; /* Fully opaque by default (0% transparency) */
            --taskbar-alpha: 0.85;
            --mica-blur: 20px;
            --accent: #0067c0;
            --accent-dark: #005a9e;
            --text-dark: #202020;
            --text-light: #ffffff;
            --border-light: rgba(0, 0, 0, 0.1);
            --border-dark: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-image: var(--bg-image);
            background-color: var(--bg-color);
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            color: var(--text-dark);
            user-select: none; /* Prevent text selection during drag */
            transition: background 0.5s ease;
        }

        .dark-mode {
            color: var(--text-light);
            --win-rgb: 32, 32, 32;
            --taskbar-rgb: 32, 32, 32;
            --border-light: var(--border-dark);
        }
        
        .transparent-mode {
            color: var(--text-light);
            --win-rgb: 20, 20, 20;
            --taskbar-rgb: 20, 20, 20;
            --border-light: var(--border-dark);
        }

        /* Mica / Glassmorphism Effect */
        .mica-panel {
            background: rgba(var(--win-rgb), var(--ui-alpha));
            backdrop-filter: blur(var(--mica-blur));
            -webkit-backdrop-filter: blur(var(--mica-blur));
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }

        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 48px; /* Leave room for Taskbar */
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px;
            z-index: 10;
        }

        .desktop-icon {
            width: 74px;
            height: 74px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .desktop-icon:hover { background: rgba(255, 255, 255, 0.2); }
        .dark-mode .desktop-icon:hover, .transparent-mode .desktop-icon:hover { background: rgba(255, 255, 255, 0.1); }
        .desktop-icon span {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            font-size: 0.75rem;
            margin-top: 4px;
            text-align: center;
            line-height: 1.1;
        }

        .os-window {
            position: absolute;
            top: 15%;
            left: 20%;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-origin: center;
            transition: opacity 0.15s ease, transform 0.15s ease;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            background: rgba(var(--win-rgb), var(--ui-alpha));
            border: 1px solid var(--border-light);
            backdrop-filter: blur(var(--mica-blur));
            -webkit-backdrop-filter: blur(var(--mica-blur));
        }

        .os-window.minimized {
            transform: scale(0.9) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        
        .os-window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 48px) !important;
            border-radius: 0;
        }

        .window-header {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 12px;
            background: transparent;
            cursor: default;
        }

        .window-title {
            font-size: 0.75rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        /* Right-aligned Window Controls */
        .window-controls {
            display: flex;
            height: 100%;
        }

        .win-btn {
            width: 46px;
            height: 100%;
            border: none;
            background: transparent;
            color: inherit;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .win-btn:hover { background: rgba(0,0,0,0.05); }
        .dark-mode .win-btn:hover, .transparent-mode .win-btn:hover { background: rgba(255,255,255,0.05); }
        
        /* Required: Red close button on hover */
        .win-btn-close:hover { 
            background: #e81123 !important; 
            color: white !important; 
        }

        .window-content {
            flex: 1;
            position: relative;
            overflow: auto;
            background: transparent;
        }

        /* App Specific Styles */
        .cmd-window {
            background: rgba(12, 12, 12, var(--ui-alpha)) !important;
            color: #cccccc !important;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 8px;
        }
        .cmd-input {
            background: transparent;
            border: none;
            color: inherit;
            outline: none;
            font-family: inherit;
            flex: 1;
            margin-left: 4px;
        }

        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 9999;
            background: rgba(var(--taskbar-rgb), var(--taskbar-alpha));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-light);
            padding: 0 12px;
        }

        /* Left aligned items */
        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .taskbar-right {
            display: flex;
            align-items: center;
            height: 100%;
            gap: 8px;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .taskbar-icon:hover { background: rgba(255, 255, 255, 0.5); }
        .dark-mode .taskbar-icon:hover, .transparent-mode .taskbar-icon:hover { background: rgba(255, 255, 255, 0.1); }
        
        .taskbar-icon.open::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 3px;
            background: #888;
            border-radius: 2px;
        }
        .taskbar-icon.active::after {
            width: 16px;
            background: var(--accent);
        }

        /* Custom Nova 4-point star Logo */
        #start-button { padding: 8px; border-radius: 4px; }
        .nova-logo {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }

        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 12px; /* Left aligned */
            transform: translateY(20px);
            width: 640px;
            height: 720px;
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 8px;
            padding: 24px 32px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            background: rgba(var(--win-rgb), var(--ui-alpha));
        }
        
        #start-menu.show {
            transform: translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .search-bar {
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dark-mode .search-bar, .transparent-mode .search-bar { background: rgba(0,0,0,0.3); border-color: #444; }
        .search-bar input { background: transparent; border: none; outline: none; width: 100%; color: inherit; }

        .pinned-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px 8px;
        }

        .pinned-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
        }
        .pinned-app:hover { background: rgba(0,0,0,0.05); }
        .dark-mode .pinned-app:hover, .transparent-mode .pinned-app:hover { background: rgba(255,255,255,0.05); }
        .pinned-app svg { width: 32px; height: 32px; }
        .pinned-app span { font-size: 0.75rem; text-align: center; }

        .start-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="dark-mode">

    <!-- Desktop Environment -->
    <div id="desktop" onclick="closeStartMenu()"></div>

    <!-- Start Menu -->
    <div id="start-menu" class="mica-panel">
        <div class="search-bar">
            <svg class="w-4 h-4 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" placeholder="Type here to search">
        </div>
        <div class="flex justify-between mb-4"><span class="text-sm font-semibold">Pinned</span></div>
        <div class="pinned-grid" id="start-pinned-apps"></div>
        <div class="start-footer mt-auto">
            <div class="flex items-center gap-3 p-2 rounded hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer">
                <div class="user-avatar">N</div>
                <span class="text-sm">Nova User</span>
            </div>
            <!-- Power Off Button triggers 3-second sequence -->
            <button class="p-2 rounded hover:bg-black/5 dark:hover:bg-white/5 cursor-pointer" onclick="closeOS()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </button>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <!-- Left Aligned Icons -->
        <div class="taskbar-left" id="taskbar-apps">
            <!-- Custom 4-Point Star Logo -->
            <div id="start-button" class="taskbar-icon" onclick="toggleStartMenu()">
                <svg viewBox="0 0 100 100" class="nova-logo">
                    <!-- 4 Point Star path -->
                    <path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" />
                </svg>
            </div>
        </div>
        
        <!-- Right Aligned Tray -->
        <div class="taskbar-right">
            <div class="flex flex-col items-end gap-0 py-1 cursor-default text-xs" style="line-height: 1.1;">
                <div id="clock-time">12:00 PM</div>
                <div id="clock-date">10/24/2026</div>
            </div>
        </div>
    </div>

    <!-- Startup Update Popup -->
    <div id="update-popup" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 mica-panel rounded-lg shadow-2xl p-6 z-[100000] min-w-[320px] text-center transition-opacity duration-300">
        <h3 class="text-lg font-semibold mb-4" id="update-text">update avalable</h3>
        <div id="update-buttons" class="flex justify-center gap-4 mt-4">
            <button class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition" onclick="showUpdateInstructions()">update</button>
            <button class="px-6 py-2 bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 rounded transition" onclick="closeUpdatePopup()">no</button>
        </div>
    </div>

    <!-- Shutdown Sequence Container -->
    <div id="shutdown-screen" class="fixed inset-0 bg-black flex flex-col items-center justify-center text-white z-[999999] opacity-0 pointer-events-none transition-opacity duration-500">
        <div class="mb-4">
            <svg viewBox="0 0 100 100" class="w-16 h-16 fill-blue-500 animate-pulse">
                <path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" />
            </svg>
        </div>
        <div class="text-xl font-light">Shutting down...</div>
    </div>

                content: () => `<textarea class="w-full h-full bg-transparent text-inherit p-2 outline-none resize-none" placeholder="Type something..."></textarea>`
            },
            'settings': {
                id: 'settings', title: 'Settings', icon: SVG_ICONS.settings, width: 700, height: 500,
                content: (id) => `
                    <div class="p-8 h-full overflow-auto">
                        <h2 class="text-2xl mb-4 font-semibold">Settings</h2>
                        <label class="block text-sm mb-2">Theme Mode</label>
                        <div class="flex gap-2 mb-4">
                            <button id="btn-theme-light-${id}" class="px-4 py-2 border border-black/20 dark:border-white/20 rounded hover:bg-black/5 ${globalTheme === 'light' ? 'ring-2 ring-blue-500' : ''}" onclick="setThemeMode('light', '${id}')">Light</button>
                            <button id="btn-theme-dark-${id}" class="px-4 py-2 border border-black/20 dark:border-white/20 rounded hover:bg-black/5 ${globalTheme === 'dark' ? 'ring-2 ring-blue-500' : ''}" onclick="setThemeMode('dark', '${id}')">Dark</button>
                            <button id="btn-theme-transparent-${id}" class="px-4 py-2 border border-black/20 dark:border-white/20 rounded hover:bg-black/5 ${globalTheme === 'transparent' ? 'ring-2 ring-blue-500' : ''}" onclick="setThemeMode('transparent', '${id}')">Transparent</button>
                        </div>
                        
                        <div id="transparency-container-${id}" class="mb-6 bg-black/5 dark:bg-white/5 p-4 rounded" style="display: ${globalTheme === 'transparent' ? 'block' : 'none'};">
                            <label class="block text-sm mb-2">Transparency meter (0 to 200)</label>
                            <div class="flex items-center gap-4">
                                <input type="range" id="transparency-slider-${id}" min="0" max="200" value="${globalTransparency}" class="flex-1" oninput="updateTransparency(this.value, '${id}')">
                                <span id="transparency-val-${id}" class="text-sm w-8">${globalTransparency}</span>
                            </div>
                        </div>

                        <label class="block text-sm mb-2 mt-4">Background Image URL</label>
                        <input type="text" class="w-full p-2 border rounded bg-transparent border-black/20 dark:border-white/20" placeholder="https://..." onchange="setBgUrl(this.value)">
                    </div>`
            },
            'cmd': {
                id: 'cmd', title: 'Command Prompt', icon: SVG_ICONS.cmd, width: 650, height: 400,
                content: (id) => `
                    <div class="w-full h-full cmd-window flex flex-col cursor-text" onclick="document.getElementById('cmd-in-${id}').focus()">
                        <div id="cmd-out-${id}" class="flex-1 overflow-y-auto whitespace-pre-wrap">Nova OS [Version 11.0.0]<br>(c) Nova Corporation. All rights reserved.<br><br></div>
                        <div class="flex items-center">
                            <span>C:\\Users\\Nova></span>
                            <input type="text" id="cmd-in-${id}" class="cmd-input" autocomplete="off" onkeydown="handleCmd(event, '${id}')">
                        </div>
                    </div>`
            },
            'browser': {
                id: 'browser', title: 'Browser', icon: SVG_ICONS.browser, width: 900, height: 600,
                content: () => `<iframe src="https://onex558.github.io/Simple-Scramjet-proxy-static-HTML-/" style="width:100%; height:100%; border:none; background: #fff;"></iframe>`
            },
            'yt2': {
                id: 'yt2', title: 'YT 2', icon: SVG_ICONS.yt2, width: 950, height: 650,
                content: () => `<iframe src="https://atlasos-official.github.io/Galaxy/yt2" style="width:100%; height:100%; border:none; background: #fff;"></iframe>`
            },
            'ajgconnect': {
                id: 'ajgconnect', title: 'AJG-Connect', icon: SVG_ICONS.ajgconnect, width: 850, height: 700,
                content: () => `<iframe src="https://atlasos-official.github.io/Galaxy/chats" style="width:100%; height:100%; border:none; background: #fff;"></iframe>`
            }
        };

        window.onload = () => {
            initDesktop();
            updateClock();
            setInterval(updateClock, 1000);
        };

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12; h = h ? h : 12; 
            m = m < 10 ? '0' + m : m;
            document.getElementById('clock-time').textContent = `${h}:${m} ${ampm}`;
            document.getElementById('clock-date').textContent = `${now.getMonth()+1}/${now.getDate()}/${now.getFullYear()}`;
        }

        function initDesktop() {
            const desktop = document.getElementById('desktop');
            const startPins = document.getElementById('start-pinned-apps');
            
            Object.values(appRegistry).forEach(app => {
                // Add to Desktop
                const dIcon = document.createElement('div');
                dIcon.className = 'desktop-icon';
                dIcon.ondblclick = () => openApp(app.id);
                dIcon.innerHTML = `${app.icon}<span>${app.title}</span>`;
                desktop.appendChild(dIcon);
                
                // Add to Start Menu
                const pIcon = document.createElement('div');
                pIcon.className = 'pinned-app';
                pIcon.onclick = () => { openApp(app.id); closeStartMenu(); };
                pIcon.innerHTML = `${app.icon}<span>${app.title}</span>`;
                startPins.appendChild(pIcon);
            });
        }

        function toggleStartMenu() {
            document.getElementById('start-menu').classList.toggle('show');
        }
        function closeStartMenu() {
            document.getElementById('start-menu').classList.remove('show');
        }

        function openApp(appId) {
            if (openApps[appId]) {
                bringToFront(appId);
                const win = document.getElementById(`win-${appId}`);
                if (win.classList.contains('minimized')) toggleMinimize(appId);
                return;
            }

            const app = appRegistry[appId];
            const win = document.createElement('div');
            win.id = `win-${appId}`;
            win.className = 'os-window';
            win.style.width = `${app.width}px`;
            win.style.height = `${app.height}px`;
            
            const offset = (Object.keys(openApps).length * 30);
            win.style.top = `max(5%, calc(50% - ${app.height/2}px + ${offset}px))`;
            win.style.left = `max(5%, calc(50% - ${app.width/2}px + ${offset}px))`;
            
            win.innerHTML = `
                <div class="window-header" onmousedown="bringToFront('${appId}')">
                    <div class="window-title"><div class="w-4 h-4">${app.icon}</div>${app.title}</div>
                    <div class="window-controls">
                        <button class="win-btn" onclick="toggleMinimize('${appId}')">${SVG_ICONS.winControls.min}</button>
                        <button class="win-btn" onclick="toggleMaximize('${appId}')">${SVG_ICONS.winControls.max}</button>
                        <button class="win-btn win-btn-close" onclick="closeApp('${appId}')">${SVG_ICONS.winControls.close}</button>
                    </div>
                </div>
                <div class="window-content" onmousedown="bringToFront('${appId}')">
                    ${app.content(appId)}
                </div>
            `;
            
            document.body.appendChild(win);
            openApps[appId] = { isMaximized: false };
            addTaskbarPin(appId);
            bringToFront(appId);
            if(appId === 'cmd') setTimeout(() => document.getElementById(`cmd-in-${appId}`).focus(), 50);
        }

        function closeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if(!win) return;
            win.style.opacity = '0';
            win.style.transform = 'scale(0.95)';
            setTimeout(() => {
                win.remove();
                delete openApps[appId];
                removeTaskbarPin(appId);
            }, 150);
        }

        function toggleMinimize(appId) {
            const win = document.getElementById(`win-${appId}`);
            const pin = document.getElementById(`pin-${appId}`);
            if (win.classList.contains('minimized')) {
                win.classList.remove('minimized');
                bringToFront(appId);
            } else {
                win.classList.add('minimized');
                pin.classList.remove('active');
            }
        }
        
        function toggleMaximize(appId) {
            const win = document.getElementById(`win-${appId}`);
            const state = openApps[appId];
            if (state.isMaximized) {
                win.classList.remove('maximized');
                state.isMaximized = false;
            } else {
                win.classList.add('maximized');
                state.isMaximized = true;
            }
            bringToFront(appId);
        }

        function bringToFront(appId) {
            const win = document.getElementById(`win-${appId}`);
            if(!win) return;
            highestZ++;
            win.style.zIndex = highestZ;
            activeAppId = appId;
            
            document.querySelectorAll('.taskbar-icon.open').forEach(p => p.classList.remove('active'));
            const pin = document.getElementById(`pin-${appId}`);
            if(pin && !win.classList.contains('minimized')) pin.classList.add('active');
        }

        function addTaskbarPin(appId) {
            const tApps = document.getElementById('taskbar-apps');
            const pin = document.createElement('div');
            pin.id = `pin-${appId}`;
            pin.className = 'taskbar-icon open active';
            pin.innerHTML = `<div style="transform: scale(0.65)">${appRegistry[appId].icon}</div>`;
            pin.onclick = () => {
                const win = document.getElementById(`win-${appId}`);
                if (win.style.zIndex == highestZ && !win.classList.contains('minimized')) {
                    toggleMinimize(appId);
                } else {
                    if (win.classList.contains('minimized')) toggleMinimize(appId);
                    bringToFront(appId);
                }
            };
            tApps.appendChild(pin);
        }

        function removeTaskbarPin(appId) {
            const pin = document.getElementById(`pin-${appId}`);
            if (pin) pin.remove();
        }

        let activeDragWin = null;
        let dragOffsetX = 0, dragOffsetY = 0;

        document.addEventListener('mousedown', (e) => {
            const header = e.target.closest('.window-header');
            if (header && !e.target.closest('.window-controls')) {
                activeDragWin = header.closest('.os-window');
                const appId = activeDragWin.id.replace('win-', '');
                
                if (openApps[appId].isMaximized) toggleMaximize(appId);
                
                const rect = activeDragWin.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                document.body.style.userSelect = 'none'; // Prevent text highlighting
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (activeDragWin) {
                let newX = e.clientX - dragOffsetX;
                let newY = e.clientY - dragOffsetY;
                if (newY < 0) newY = 0; // Lock to top of screen
                activeDragWin.style.left = newX + 'px';
                activeDragWin.style.top = newY + 'px';
            }
        });

        document.addEventListener('mouseup', () => {
            activeDragWin = null;
            document.body.style.userSelect = '';
        });

        function setThemeMode(mode, appId) {
            globalTheme = mode;
            document.body.classList.remove('dark-mode', 'transparent-mode');
            const cont = document.getElementById(`transparency-container-${appId}`);
            
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                document.documentElement.style.setProperty('--ui-alpha', '1');
                if(cont) cont.style.display = 'none';
            } else if (mode === 'light') {
                document.documentElement.style.setProperty('--ui-alpha', '1');
                if(cont) cont.style.display = 'none';
            } else if (mode === 'transparent') {
                document.body.classList.add('transparent-mode');
                if(cont) cont.style.display = 'block';
                updateTransparency(globalTransparency, appId);
            }
            
            ['light', 'dark', 'transparent'].forEach(m => {
                const btn = document.getElementById(`btn-theme-${m}-${appId}`);
                if(btn) {
                    if(m === mode) btn.classList.add('ring-2', 'ring-blue-500');
                    else btn.classList.remove('ring-2', 'ring-blue-500');
                }
            });
        }
        
        function updateTransparency(val, appId) {
            globalTransparency = val;
            // Map 0 to alpha 1 (opaque), 200 to alpha 0 (fully transparent)
            const alpha = Math.max(0, 1 - (val / 200));
            document.documentElement.style.setProperty('--ui-alpha', alpha.toString());
            document.documentElement.style.setProperty('--taskbar-alpha', alpha.toString());
            const valLabel = document.getElementById(`transparency-val-${appId}`);
            if (valLabel) valLabel.textContent = val;
        }

        function setBgUrl(url) {
            if(url) document.documentElement.style.setProperty('--bg-image', `url('${url}')`);
        }

        function handleCmd(e, appId) {
            if (e.key === 'Enter') {
                const input = e.target;
                const cmd = input.value.trim();
                input.value = '';
                const out = document.getElementById(`cmd-out-${appId}`);
                out.innerHTML += `C:\\Users\\Nova> ${cmd}<br>`;
                
                const lcmd = cmd.toLowerCase();
                if (lcmd === 'cls') {
                    out.innerHTML = ``;
                } else if (lcmd === 'update') {
                    // Start the 10-second wave OS update sequence
                    const wantsUpdate = window.confirm("do you want to update to wave os?");
                    if (wantsUpdate) {
                        input.disabled = true; // Lock input
                        const loadingBar = document.createElement("div");
                        loadingBar.textContent = "Updating: [--------------------] 0%";
                        out.appendChild(loadingBar);
                        
                        let progress = 0;
                        const totalSteps = 20; 
                        
                        const updateInterval = setInterval(() => {
                            progress++;
                            const filled = "█".repeat(progress);
                            const empty = "-".repeat(totalSteps - progress);
                            const percentage = Math.floor((progress / totalSteps) * 100);
                            
                            loadingBar.textContent = `Updating: [${filled}${empty}] ${percentage}%`;
                            out.parentElement.scrollTop = out.parentElement.scrollHeight;

                            if (progress >= totalSteps) {
                                clearInterval(updateInterval);
                                loadingBar.textContent += " Complete! Redirecting...";
                                setTimeout(() => {
                                    window.location.href = "https://ajgplayz-studio.github.io/ajg-domains/wave";
                                }, 500);
                            }
                        }, 500);
                        return; // Prevent adding extra newline at bottom
                    } else {
                        closeApp(appId);
                        return;
                    }
                } else if (cmd !== '') {
                    out.innerHTML += `'${cmd}' is not recognized as an internal or external command.<br>`;
                }
                
                out.innerHTML += `<br>`;
                out.parentElement.scrollTop = out.parentElement.scrollHeight;
            }
        }

        let calcState = { val1: '', op: null, val2: '', startNew: false };
        function calcAction(id, action) {
            const disp = document.getElementById(`calc-disp-${id}`);
            const hist = document.getElementById(`calc-hist-${id}`);
            
            if (action === 'C') {
                calcState = { val1: '', op: null, val2: '', startNew: false };
                disp.textContent = '0';
                hist.textContent = '';
                return;
            }
            if (action === 'CE') { disp.textContent = '0'; return; }
            if (action === 'DEL') {
                if(calcState.startNew) return;
                disp.textContent = disp.textContent.length > 1 ? disp.textContent.slice(0, -1) : '0';
                return;
            }
            if (['/','*','-','+'].includes(action)) {
                calcState.val1 = disp.textContent;
                calcState.op = action;
                calcState.startNew = true;
                hist.textContent = `${calcState.val1} ${action === '*' ? '×' : action === '/' ? '÷' : action}`;
                return;
            }
            if (action === '=') {
                if(!calcState.op) return;
                calcState.val2 = disp.textContent;
                let v1 = parseFloat(calcState.val1);
                let v2 = parseFloat(calcState.val2);
                let res = 0;
                switch(calcState.op) {
                    case '+': res = v1 + v2; break;
                    case '-': res = v1 - v2; break;
                    case '*': res = v1 * v2; break;
                    case '/': res = v2 !== 0 ? v1 / v2 : 'Error'; break;
                }
                disp.textContent = typeof res === 'number' ? Math.round(res * 1e10) / 1e10 : res;
                hist.textContent += ` ${calcState.val2} =`;
                calcState.startNew = true;
                calcState.op = null;
                return;
            }
            
            let current = disp.textContent;
            if (calcState.startNew || current === '0' || current === 'Error') {
                current = action === '.' ? '0.' : action;
                calcState.startNew = false;
            } else {
                if(action === '.' && current.includes('.')) return;
                current += action;
            }
            disp.textContent = current;
        }
        
        function closeOS() {
            closeStartMenu();
            const sd = document.getElementById('shutdown-screen');
            sd.classList.remove('pointer-events-none');
            sd.style.opacity = '1';
            setTimeout(() => {
                window.location.href = 'https://atlasos-official.github.io/Nova/shutdown';
            }, 3000);
        }

        function closeUpdatePopup() {
            const popup = document.getElementById('update-popup');
            if (popup) {
                popup.style.opacity = '0';
                setTimeout(() => popup.remove(), 300);
            }
        }

        function showUpdateInstructions() {
            const textEl = document.getElementById('update-text');
            const btnEl = document.getElementById('update-buttons');
            if (textEl && btnEl) {
                textEl.innerHTML = 'HOW TO UPDATE<br>1.open command prompt ON OS NOT WINDOWS<br>2. type update';
                textEl.className = 'text-left text-sm mb-4 font-normal leading-relaxed';
                btnEl.innerHTML = `<button class="px-6 py-2 bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 rounded transition w-full" onclick="closeUpdatePopup()">Close</button>`;
            }
        }
    </script>
</body>
