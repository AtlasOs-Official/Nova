<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nova OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2064&auto=format&fit=crop'); /* Vibrant blue abstract curves */
            --mica-bg: rgba(243, 243, 243, 0.75);
            --mica-bg-dark: rgba(32, 32, 32, 0.75);
            --mica-blur: 20px;
            --accent: #0067c0;
            --accent-dark: #005a9e;
            --text-dark: #202020;
            --text-light: #ffffff;
            --border-light: rgba(0, 0, 0, 0.1);
            --border-dark: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg-image) no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            user-select: none;
            transition: background 0.5s ease;
        }

        .dark-mode {
            color: var(--text-light);
            --mica-bg: var(--mica-bg-dark);
            --border-light: var(--border-dark);
        }

        /* Mica Effect / Acrylic */
        .mica-panel {
            background: var(--mica-bg);
            backdrop-filter: blur(var(--mica-blur));
            -webkit-backdrop-filter: blur(var(--mica-blur));
            border: 1px solid var(--border-light);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        }

        /* Desktop & Icons */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 48px; /* Taskbar height */
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 2px;
        }

        .desktop-icon {
            width: 74px;
            height: 74px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .dark-mode .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .desktop-icon span {
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            font-size: 0.75rem;
            margin-top: 4px;
            text-align: center;
            line-height: 1.1;
        }

        /* Windows Styling */
        .os-window {
            position: absolute;
            top: 15%;
            left: 20%;
            width: 700px;
            height: 500px;
            min-width: 300px;
            min-height: 200px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-origin: center;
            transition: transform 0.15s ease, opacity 0.15s ease, width 0.2s, height 0.2s, top 0.2s, left 0.2s;
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            background: #ffffff;
            border: 1px solid var(--border-light);
        }
        
        .dark-mode .os-window {
            background: #202020;
        }

        .os-window.minimized {
            transform: scale(0.9) translateY(40px);
            opacity: 0;
            pointer-events: none;
        }
        
        .os-window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 48px) !important;
            border-radius: 0;
        }

        .window-header {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 12px;
            background: transparent;
            cursor: default;
        }

        .window-title {
            font-size: 0.75rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none; /* Let drag pass through */
        }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .win-btn {
            width: 46px;
            height: 100%;
            border: none;
            background: transparent;
            color: inherit;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s;
        }
        .win-btn:hover { background: rgba(0,0,0,0.05); }
        .dark-mode .win-btn:hover { background: rgba(255,255,255,0.05); }
        
        .win-btn-close:hover { 
            background: #e81123 !important; 
            color: white !important; 
        }

        .window-content {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #ffffff;
        }
        .dark-mode .window-content { background: #202020; }

        /* App Specifics */
        .cmd-window {
            background: #0c0c0c !important;
            color: #cccccc !important;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 8px;
        }
        .cmd-input {
            background: transparent;
            border: none;
            color: inherit;
            outline: none;
            font-family: inherit;
            width: flex-1;
            margin-left: 4px;
        }

        /* Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            background: rgba(243, 243, 243, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--border-light);
            padding: 0 12px;
        }
        
        .dark-mode #taskbar { background: rgba(32, 32, 32, 0.85); }

        .taskbar-center {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
        }

        .taskbar-right {
            position: absolute;
            right: 12px;
            display: flex;
            align-items: center;
            height: 100%;
            gap: 8px;
        }

        .taskbar-icon {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .taskbar-icon:hover { background: rgba(255, 255, 255, 0.5); }
        .dark-mode .taskbar-icon:hover { background: rgba(255, 255, 255, 0.1); }
        
        .taskbar-icon.open::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 3px;
            background: #888;
            border-radius: 2px;
        }
        .taskbar-icon.active::after {
            width: 16px;
            background: var(--accent);
        }

        /* Nova Start Button */
        #start-button {
            padding: 8px;
            border-radius: 4px;
        }
        #start-button:hover { background: rgba(255, 255, 255, 0.5); }
        .dark-mode #start-button:hover { background: rgba(255, 255, 255, 0.1); }
        .nova-logo {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 640px;
            height: 720px;
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 8px;
            padding: 24px 32px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        
        #start-menu.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .search-bar {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 20px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .dark-mode .search-bar { background: #1a1a1a; border-color: #333; }
        
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            color: inherit;
        }

        .start-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .start-section-title span:last-child {
            font-size: 0.75rem;
            font-weight: 400;
            padding: 2px 8px;
            background: rgba(0,0,0,0.05);
            border-radius: 4px;
            cursor: pointer;
        }
        .dark-mode .start-section-title span:last-child { background: rgba(255,255,255,0.1); }

        .pinned-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px 8px;
            margin-bottom: auto;
        }

        .pinned-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.1s;
        }
        .pinned-app:hover { background: rgba(0,0,0,0.05); }
        .dark-mode .pinned-app:hover { background: rgba(255,255,255,0.05); }
        .pinned-app svg { width: 32px; height: 32px; }
        .pinned-app span { font-size: 0.75rem; text-align: center; }

        .start-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
        .user-profile:hover { background: rgba(0,0,0,0.05); }
        .dark-mode .user-profile:hover { background: rgba(255,255,255,0.05); }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .system-tray-btn {
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: default;
            transition: background 0.1s;
            font-size: 0.75rem;
        }
        .system-tray-btn:hover { background: rgba(255, 255, 255, 0.5); }
        .dark-mode .system-tray-btn:hover { background: rgba(255, 255, 255, 0.1); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background-color: rgba(0,0,0,0.2); 
            border: 4px solid rgba(0,0,0,0);
            background-clip: padding-box;
            border-radius: 8px;
        }
        .dark-mode ::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(0,0,0,0.4); }
        .dark-mode ::-webkit-scrollbar-thumb:hover { background-color: rgba(255,255,255,0.4); }
    </style>
</head>

            'notepad': {
                id: 'notepad',
                title: 'Notepad',
                icon: SVG_ICONS.notepad,
                width: 600, height: 400,
                content: () => `<textarea class="w-full h-full bg-transparent text-inherit p-2 outline-none resize-none font-['Segoe_UI']" placeholder="Type something..."></textarea>`

        window.onload = () => {

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            h = h ? h : 12; 
            m = m < 10 ? '0' + m : m;
            
            document.getElementById('clock-time').textContent = `${h}:${m} ${ampm}`;

        }

        function initDesktop() {
            const desktop = document.getElementById('desktop');
            const startPins = document.getElementById('start-pinned-apps');
            
            Object.values(appRegistry).forEach(app => {
                // Desktop
                const dIcon = document.createElement('div');
                dIcon.className = 'desktop-icon';
                dIcon.ondblclick = () => openApp(app.id);
                // Mobile single tap fallback
                let touchTime = 0;
                dIcon.addEventListener('touchstart', (e) => {
                    const now = new Date().getTime();
                    if(now - touchTime < 300) { openApp(app.id); }
                    touchTime = now;
                });
                dIcon.innerHTML = `${app.icon}<span>${app.title}</span>`;
                desktop.appendChild(dIcon);
                
                // Start Menu Pinned
                const pIcon = document.createElement('div');
                pIcon.className = 'pinned-app';
                pIcon.onclick = () => { openApp(app.id); closeStartMenu(); };
                pIcon.innerHTML = `${app.icon}<span>${app.title}</span>`;
                startPins.appendChild(pIcon);

        function toggleStartMenu() {

        function openApp(appId) {
            if (openApps[appId]) {
                const win = document.getElementById(`win-${appId}`);
                if (win.classList.contains('minimized')) {
                    toggleMinimize(appId);
                } else {
                    bringToFront(appId);
                }
                return;
            }

            const app = appRegistry[appId];
            const winId = `win-${appId}`;
            
            const win = document.createElement('div');
            win.id = winId;
            win.className = 'os-window';
            win.style.width = `${app.width}px`;
            win.style.height = `${app.height}px`;
            
            // Center cascade
            const offset = (Object.keys(openApps).length * 30);
            win.style.top = `max(10%, calc(50% - ${app.height/2}px + ${offset}px))`;
            win.style.left = `max(10%, calc(50% - ${app.width/2}px + ${offset}px))`;
            
            win.innerHTML = `
                <div class="window-header" onmousedown="bringToFront('${appId}')">
                    <div class="window-title">
                        <div class="w-4 h-4">${app.icon}</div>
                        ${app.title}
                    </div>
                    <div class="window-controls">
                        <button class="win-btn" onclick="toggleMinimize('${appId}')">${SVG_ICONS.winControls.min}</button>
                        <button class="win-btn" onclick="toggleMaximize('${appId}')">${SVG_ICONS.winControls.max}</button>
                        <button class="win-btn win-btn-close" onclick="closeApp('${appId}')">${SVG_ICONS.winControls.close}</button>
                    </div>
                </div>
                <div class="window-content" onmousedown="bringToFront('${appId}')">
                    ${app.content(appId)}
                </div>
            `;
            
            document.body.appendChild(win);
            makeDraggable(win, win.querySelector('.window-header'));
            
            openApps[appId] = { isMaximized: false };
            addTaskbarPin(appId);
            bringToFront(appId);
            
            if(appId === 'cmd') {
                setTimeout(() => document.getElementById(`cmd-in-${appId}`).focus(), 50);
            }
        }

        function closeApp(appId) {
            const win = document.getElementById(`win-${appId}`);
            if(!win) return;
            win.style.opacity = '0';
            win.style.transform = 'scale(0.95)';
            setTimeout(() => {
                win.remove();
                delete openApps[appId];
                removeTaskbarPin(appId);
                if(activeAppId === appId) activeAppId = null;
            }, 150);

        function toggleMinimize(appId) {
            const win = document.getElementById(`win-${appId}`);
            const pin = document.getElementById(`pin-${appId}`);
            
            if (win.classList.contains('minimized')) {
                win.classList.remove('minimized');
                bringToFront(appId);
            } else {
                win.classList.add('minimized');
                pin.classList.remove('active');
                if(activeAppId === appId) activeAppId = null;

        function toggleMaximize(appId) {

            const state = openApps[appId];
            
            if (state.isMaximized) {
                win.classList.remove('maximized');

            } else {
                win.classList.add('maximized');
                state.isMaximized = true;

        function bringToFront(appId) {

            highestZ++;

            activeAppId = appId;
            
            // Update active state in taskbar
            document.querySelectorAll('.taskbar-icon.open').forEach(p => p.classList.remove('active'));
            const pin = document.getElementById(`pin-${appId}`);
            if(pin && !win.classList.contains('minimized')) pin.classList.add('active');
        }

        function makeDraggable(element, handle) {
            let isDragging = false;
            let startX = 0, startY = 0;

            handle.addEventListener('mousedown', (e) => {
                if (e.target.closest('.window-controls')) return;
                e.preventDefault();
                
                const appId = element.id.replace('win-', '');
                if (openApps[appId] && openApps[appId].isMaximized) {
                    toggleMaximize(appId);
                }

                isDragging = true;
                startX = e.clientX - element.offsetLeft;
                startY = e.clientY - element.offsetTop;

                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            handle.addEventListener('touchstart', (e) => {
                if (e.target.closest('.window-controls')) return;
                const appId = element.id.replace('win-', '');
                if (openApps[appId] && openApps[appId].isMaximized) {
                    toggleMaximize(appId);
                }

                isDragging = true;
                startX = e.touches[0].clientX - element.offsetLeft;
                startY = e.touches[0].clientY - element.offsetTop;

                document.body.style.userSelect = 'none';
                document.addEventListener('touchmove', onTouchMove, { passive: false });
                document.addEventListener('touchend', onTouchEnd);
            });

            function onMouseMove(e) {
                if (!isDragging) return;
                let newX = e.clientX - startX;
                let newY = e.clientY - startY;
                
                if (newY < 0) newY = 0; // Prevent dragging above screen top
                
                element.style.left = newX + 'px';
                element.style.top = newY + 'px';
            }

            function onTouchMove(e) {
                if (!isDragging) return;
                e.preventDefault();
                let newX = e.touches[0].clientX - startX;
                let newY = e.touches[0].clientY - startY;
                
                if (newY < 0) newY = 0;
                
                element.style.left = newX + 'px';
                element.style.top = newY + 'px';
            }

            function onMouseUp() {
                isDragging = false;
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }

            function onTouchEnd() {
                isDragging = false;
                document.body.style.userSelect = '';
                document.removeEventListener('touchmove', onTouchMove);
                document.removeEventListener('touchend', onTouchEnd);
            }
        }

        function addTaskbarPin(appId) {

            pin.id = `pin-${appId}`;

            tApps.appendChild(pin);
        }

        function removeTaskbarPin(appId) {

        // CMD Logic
        function handleCmd(e, appId) {

                    out.innerHTML += ` Directory of C:\\Users\\Nova<br><br>10/24/2023  12:00 PM    &lt;DIR&gt;          .<br>10/24/2023  12:00 PM    &lt;DIR&gt;          ..<br>10/24/2023  12:00 PM                 0 Documents<br>10/24/2023  12:00 PM                 0 Downloads<br>               2 File(s)              0 bytes<br>               2 Dir(s)  102,400,000,000 bytes free<br>`;

        // Calculator Logic
        let calcState = { val1: '', op: null, val2: '', startNew: false };
        function calcAction(id, action) {
            const disp = document.getElementById(`calc-disp-${id}`);
            const hist = document.getElementById(`calc-hist-${id}`);
            
            if (action === 'C') {
                calcState = { val1: '', op: null, val2: '', startNew: false };
                disp.textContent = '0';
                hist.textContent = '';
                return;
            }
            if (action === 'CE') {
                disp.textContent = '0';
                if(calcState.op) calcState.val2 = '';
                else calcState.val1 = '';
                return;
            }
            if (action === 'DEL') {
                if(calcState.startNew) return;
                let t = disp.textContent;
                t = t.length > 1 ? t.slice(0, -1) : '0';
                disp.textContent = t;
                if(calcState.op) calcState.val2 = t === '0' ? '' : t;
                else calcState.val1 = t === '0' ? '' : t;
                return;
            }
            
            if (['/','*','-','+'].includes(action)) {
                let current = disp.textContent;
                if(calcState.val1 && calcState.op && !calcState.startNew) {
                    // chain calculate
                    calcAction(id, '=');
                    current = disp.textContent;
                }
                calcState.val1 = current;
                calcState.op = action;
                calcState.startNew = true;
                
                let displayOp = action;
                if(action === '*') displayOp = '×';
                if(action === '/') displayOp = '÷';
                hist.textContent = `${calcState.val1} ${displayOp}`;
                return;
            }
            
            if (action === '=') {
                if(!calcState.op) return;
                let current = disp.textContent;
                calcState.val2 = current;
                
                let v1 = parseFloat(calcState.val1);
                let v2 = parseFloat(calcState.val2);
                let res = 0;
                
                switch(calcState.op) {
                    case '+': res = v1 + v2; break;
                    case '-': res = v1 - v2; break;
                    case '*': res = v1 * v2; break;
                    case '/': res = v2 !== 0 ? v1 / v2 : 'Error'; break;
                }
                
                if (typeof res === 'number') {
                    // fix js float issues
                    res = Math.round(res * 10000000000) / 10000000000;
                }
                
                disp.textContent = res;
                hist.textContent += ` ${calcState.val2} =`;
                calcState.val1 = res.toString();
                calcState.op = null;
                calcState.val2 = '';
                calcState.startNew = true;
                return;
            }
            
            if (action === '±') {
                let t = disp.textContent;
                if(t !== '0' && t !== 'Error') {
                    t = t.startsWith('-') ? t.substring(1) : '-' + t;
                    disp.textContent = t;
                    if(calcState.op) calcState.val2 = t;
                    else calcState.val1 = t;
                }
                return;
            }
            
            // Numbers and decimal
            let current = disp.textContent;
            if (calcState.startNew || current === '0' || current === 'Error') {
                current = action === '.' ? '0.' : action;
                calcState.startNew = false;
            } else {
                if(action === '.' && current.includes('.')) return;
                current += action;
            }
            
            disp.textContent = current;
            if(calcState.op) calcState.val2 = current;
            else calcState.val1 = current;
        }
        
        function closeOS() {
            // Simulated shutdown
            document.body.innerHTML = `<div class="fixed inset-0 bg-black flex flex-col items-center justify-center text-white z-[999999]">
                <div class="mb-4">
                    <svg viewBox="0 0 100 100" class="w-16 h-16 fill-blue-500 animate-pulse">
                        <path d="M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z" />
                    </svg>
                </div>
                <div class="text-xl font-light">Shutting down...</div>
            </div>`;
        }

    </script>
</body>
